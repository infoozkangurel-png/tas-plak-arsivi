<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#352319"><title>Taş Plak Arşivi</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Plak Arşivi">
<style>
:root{--bg:#eee5d5;--paper:#f8f1e4;--card:#fffaf0;--ink:#35271e;--muted:#806e5c;--line:#d9c7aa;--wood:#4b2f20;--wood2:#68452d;--gold:#b58a4c;--gold2:#d4b477;--red:#873d32;--green:#52684c;--shadow:0 8px 24px #3b28151a;--radius:16px;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#f7efdf 0,#eee5d5 55%,#e7dac6 100%);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c99c55;outline-offset:2px}.shell{max-width:1320px;margin:auto;padding:18px 22px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;background:linear-gradient(120deg,#3a261b,#65442c);border:1px solid #8b6842;border-radius:20px;color:#f8edda;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:54px;height:54px;border:2px solid var(--gold2);border-radius:50%;display:grid;place-items:center;font-size:28px;color:var(--gold2);box-shadow:inset 0 0 0 4px #ffffff12}.brand h1{font-size:clamp(21px,3vw,30px);margin:0;letter-spacing:.3px}.brand p{margin:2px 0 0;color:#dfc9a6;font:12px system-ui,sans-serif;letter-spacing:1.4px;text-transform:uppercase}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;min-height:42px;font:600 13px system-ui,sans-serif}.btn.primary{background:var(--gold);border-color:var(--gold);color:#24170f}.btn.dark{background:#513622;color:#fff2dc;border-color:#876340}.btn.danger{color:var(--red);border-color:#c99b8e}.btn.small{padding:6px 9px;min-height:34px;font-size:12px}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;margin-top:20px}.side{align-self:start;position:sticky;top:16px;background:#f7efdfd9;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:var(--muted);font:600 14px system-ui,sans-serif}.nav button.active,.nav button:hover{background:#e8d9c1;color:var(--wood)}.nav .ico{display:inline-block;width:25px}.side-note{margin:14px 5px 4px;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}main{min-width:0}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:3px 0 16px}.page-head h2{font-size:26px;margin:0;color:var(--wood)}.page-head p{margin:4px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font:12px system-ui,sans-serif}.stat strong{display:block;font-size:28px;color:var(--wood);margin-top:4px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel-head h3{margin:0;font-size:19px;color:var(--wood)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:5px;min-width:0}.field label{font:600 12px system-ui,sans-serif;color:var(--muted)}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#fffdf8;color:var(--ink);padding:10px 11px;min-height:42px}.field textarea{min-height:88px;resize:vertical}.search-wrap{flex:1 1 240px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.shelf{background:#fffaf0;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;box-shadow:0 3px 12px #3b281510}.shelf:hover,.record:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.shelf-cover{aspect-ratio:1.35;background:linear-gradient(145deg,#e5d5ba,#c9ad83);display:grid;place-items:center;overflow:hidden;color:#896b48;font-size:48px}.shelf-cover img{width:100%;height:100%;object-fit:cover}.shelf-info{padding:11px}.shelf-info strong{display:block;font-size:16px;color:var(--wood);overflow-wrap:anywhere}.shelf-info small{color:var(--muted);font:12px system-ui,sans-serif}.record-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.record{background:#fffaf0;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}.record-img{aspect-ratio:1.2;background:linear-gradient(145deg,#e8dcc8,#c8b18e);display:grid;place-items:center;font-size:42px;color:#876b49;overflow:hidden}.record-img img{width:100%;height:100%;object-fit:cover}.record-body{padding:11px}.record-body h4{margin:0 0 4px;font-size:16px;color:var(--wood);overflow-wrap:anywhere}.record-body p{margin:2px 0;color:var(--muted);font:12px system-ui,sans-serif}.tag{display:inline-block;background:#eee2cd;color:#715538;border-radius:20px;padding:3px 8px;font:11px system-ui,sans-serif;margin:5px 4px 0 0}.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #cbb895;border-radius:14px}.empty b{display:block;font-size:18px;color:var(--wood);margin-bottom:5px}.detail{display:grid;grid-template-columns:minmax(180px,300px) minmax(0,1fr);gap:20px}.detail-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#e7d8c0;border:1px solid var(--line)}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.muted{color:var(--muted)}.notice{padding:12px 14px;background:#f0e5d1;border:1px solid #d8c29e;border-radius:12px;color:#654b2e;margin-bottom:14px;font:13px/1.5 system-ui,sans-serif}.status{font:12px system-ui,sans-serif;color:var(--muted)}.status.good{color:var(--green)}.status.bad{color:var(--red)}.modal{position:fixed;inset:0;background:#1c130dcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.dialog{background:var(--paper);border:1px solid var(--gold);border-radius:18px;width:min(680px,100%);max-height:92dvh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0005}.dialog h3{margin:0 0 15px;color:var(--wood);font-size:23px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:17px}.preview{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.footer{text-align:center;color:#8b765e;font:11px system-ui,sans-serif;padding:20px}.mobile-nav{display:none}.hidden{display:none!important}
:root[data-theme=dark]{--bg:#211a15;--paper:#2b2119;--card:#30251c;--ink:#f1e5d2;--muted:#c1aa8d;--line:#5d4935;--wood:#e1c69a;--wood2:#68452d;--gold:#c69a5c;--gold2:#e0c18b;--shadow:0 8px 24px #0004;color-scheme:dark} :root[data-theme=dark] body{background:radial-gradient(ellipse at top,#392a1e,#211a15 75%)} :root[data-theme=dark] .side{background:#30251c} :root[data-theme=dark] .shelf,:root[data-theme=dark] .record,:root[data-theme=dark] .field input,:root[data-theme=dark] .field select,:root[data-theme=dark] .field textarea,:root[data-theme=dark] .search{background:#382b20;color:var(--ink)} :root[data-theme=dark] .shelf-cover,:root[data-theme=dark] .record-img{background:linear-gradient(145deg,#55402d,#38291d)}
@media(max-width:800px){.shell{padding:10px 12px 90px}.top{padding:14px;border-radius:15px;align-items:flex-start}.brand-mark{width:43px;height:43px;font-size:23px}.top-actions .btn{padding:7px 9px;min-height:36px}.layout{display:block;margin-top:13px}.side{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:11px}.stat strong{font-size:24px}.page-head h2{font-size:23px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:10;background:#3d291e;border-top:1px solid #9b754a;padding:6px max(5px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));gap:3px}.mobile-nav button{border:0;background:transparent;color:#e8d8bd;font:11px system-ui,sans-serif;padding:6px 2px;border-radius:8px}.mobile-nav button.active{background:#755333;color:white}.mobile-nav span{display:block;font-size:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px}.record-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.detail{grid-template-columns:1fr}.detail-photo{max-width:240px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.panel{padding:13px}.toolbar .btn{flex:1 1 auto}}
@media(max-width:390px){.brand p{font-size:10px;letter-spacing:.8px}.top{gap:8px}.top-actions{max-width:115px}.top-actions .btn{font-size:11px}.record-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-meta{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.shell,.mobile-nav,.modal{display:none!important}#printArea{display:block!important;color:#111;font:12px Arial}.print-row{display:flex;gap:12px;border-bottom:1px solid #aaa;padding:9px;break-inside:avoid}.print-row img{width:75px;height:75px;object-fit:cover}.print-row h3{margin:0 0 5px}}
html{padding-top:env(safe-area-inset-top,0px)}
.vinyl{display:block;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 3%,hsl(var(--h,30) 90% 60%) 4% 17%,#111 18% 21%,#2c2c2c 22%,#111 25%,#333 27%,#111 31%,#2b2b2b 35%,#111 41%,#222 52%,#0d0d0d 100%);box-shadow:0 5px 16px #0007;animation:sp 9s linear infinite}

.price{display:inline-block;color:#fff;background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:20px;padding:2px 10px;font:700 12px system-ui;margin:5px 4px 0 0}
</style></head><body>
<div class="shell">
<header class="top"><div class="brand"><div class="brand-mark">♫</div><div><h1>Taş Plak Arşivi</h1><p>Hatıraların sesi, koleksiyonun hafızası</p></div></div><div class="top-actions"><button class="btn dark" id="instBtn" hidden>📲 Yükle</button><button class="btn dark" id="backupTop">Yedek al</button><button class="btn dark" id="themeBtn">☾ Tema</button></div></header>
<div id="migrationNotice" class="notice hidden"></div>
<div class="layout"><aside class="side"><nav class="nav" id="sideNav"><button data-page="home" class="active"><span class="ico">⌂</span> Genel Bakış</button><button data-page="shelves"><span class="ico">▤</span> Raflarım</button><button data-page="catalog"><span class="ico">◉</span> Plak Kataloğu</button><button data-page="gallery"><span class="ico">▧</span> Fotoğraf Galerisi</button><button data-page="reports"><span class="ico">▥</span> Raporlar</button><button data-page="settings"><span class="ico">⚙</span> Ayarlar</button></nav><div class="side-note">✦ Koleksiyonunuz bu cihazda saklanır. İnternet bağlantısı gerekmez.</div></aside><main id="main"></main></div>
<div class="footer">TAŞ PLAK ARŞİVİ · Kişisel koleksiyonunuzun dijital hafızası</div>
</div>
<nav class="mobile-nav" id="mobileNav"><button data-page="home" class="active"><span>⌂</span>Ana sayfa</button><button data-page="shelves"><span>▤</span>Raflar</button><button data-page="catalog"><span>◉</span>Plaklar</button><button data-page="gallery"><span>▧</span>Galeri</button><button data-page="settings"><span>⚙</span>Ayarlar</button></nav>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog" id="dialog"></div></div><div id="printArea" class="hidden"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden"><input type="file" id="xlsFile" class="hidden">
<script>
'use strict';
const DB_NAME='tas_plak_arsivi_db',DB_VERSION=1,STORE='app';
const LEGACY_KEYS=['plak_v1','plak_v1_b'];
let db,state={shelves:[],records:[],settings:{theme:'vintage',autoBackup:false},meta:{migrated:false}},page='home',query='',filterShelf='all',editingPhoto='',lastBackup=0;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getDB(key){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putDB(key,value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function delDB(key){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function normalizeLegacy(arr){return arr.map((s,i)=>({id:'shelf-'+(i+1),number:i+1,name:String(s?.a||''),artistPhoto:typeof s?.p==='string'?s.p:'',createdAt:Date.now()}))}
function legacyRecords(arr){const out=[];arr.forEach((s,i)=>(Array.isArray(s?.r)?s.r:[]).forEach((name,j)=>{if(String(name||'').trim())out.push({id:uid(),shelfId:'shelf-'+(i+1),title:String(name).trim(),artist:String(s?.a||''),cover:'',genre:'',year:'',label:'',condition:'Belirtilmedi',notes:'',favorite:false,createdAt:Date.now(),legacyOrder:j})}));return out}
async function migrateIfNeeded(){let existing=await getDB('state');if(existing&&Array.isArray(existing.shelves)){state=existing;return false}
 let legacy=null,source='';for(const k of LEGACY_KEYS){try{const raw=localStorage.getItem(k);if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed)&&parsed.length===100){legacy=parsed;source=k;break}}}catch(e){}}
 if(legacy){const shelves=normalizeLegacy(legacy),records=legacyRecords(legacy);state={shelves,records,settings:{theme:'vintage',autoBackup:false},meta:{migrated:true,migratedAt:new Date().toISOString(),source,legacyShelfCount:legacy.length,legacyRecordCount:records.length}};await putDB('state',state);return true}
 state={shelves:Array.from({length:100},(_,i)=>({id:'shelf-'+(i+1),number:i+1,name:'',artistPhoto:'',createdAt:Date.now()})),records:[],settings:{theme:'vintage',autoBackup:false},meta:{migrated:false}};await putDB('state',state);return false}
async function persist(){await putDB('state',state);$('saveStatus')&&($('saveStatus').textContent='Kaydedildi · '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}))}
function counts(){return {records:state.records.length,shelves:state.shelves.length,used:state.shelves.filter(s=>state.records.some(r=>r.shelfId===s.id)||s.name||s.artistPhoto).length,artists:new Set(state.records.map(r=>r.artist.trim()).filter(Boolean).concat(state.shelves.map(s=>s.name.trim()).filter(Boolean))).size}}
function shelfName(id){const s=state.shelves.find(x=>x.id===id);return s?(s.name||'İsimsiz raf'):'Raf bulunamadı'}
function photoHTML(src,alt=''){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<span class="vinyl"></span>'}
function go(p){page=p;query='';render()}
function navActive(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function render(){navActive();const m=$('main');if(page==='home')m.innerHTML=homePage();else if(page==='shelves')m.innerHTML=shelvesPage();else if(page==='catalog')m.innerHTML=catalogPage();else if(page==='gallery')m.innerHTML=galleryPage();else if(page==='reports')m.innerHTML=reportsPage();else if(page==='settings')m.innerHTML=settingsPage();else if(page==='shelf')m.innerHTML=shelfPage(window.activeShelf);else if(page==='record')m.innerHTML=recordPage(window.activeRecord);bindPage();}
function homePage(){const c=counts(),recent=[...state.records].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).slice(0,6);return `<div class="page-head"><div><h2>Hoş geldiniz</h2><p>Koleksiyonunuzun bugünkü görünümü.</p></div><button class="btn primary" data-action="add-record">＋ Plak ekle</button></div><section class="stats"><div class="stat"><span>Toplam plak</span><strong>${c.records}</strong></div><div class="stat"><span>Toplam raf</span><strong>${c.shelves}</strong></div><div class="stat"><span>Kullanılan raf</span><strong>${c.used}</strong></div><div class="stat"><span>Sanatçı / isim</span><strong>${c.artists}</strong></div></section><section class="panel"><div class="panel-head"><h3>Koleksiyon kısayolları</h3><span class="status" id="saveStatus">Cihazda saklanır</span></div><div class="toolbar"><button class="btn" data-page="shelves">Rafları görüntüle</button><button class="btn" data-page="catalog">Tüm plaklar</button><button class="btn" data-page="gallery">Fotoğraf galerisi</button><button class="btn" data-action="backup">Yedek oluştur</button></div></section><section class="panel"><div class="panel-head"><h3>Son eklenen / düzenlenen plaklar</h3><button class="btn small" data-page="catalog">Tümünü gör</button></div>${recent.length?`<div class="record-grid">${recent.map(recordCard).join('')}</div>`:empty('Henüz plak kaydı yok','İlk plağınızı ekleyerek koleksiyonunuzu oluşturmaya başlayın.')}</section>`}
function shelvesPage(){return `<div class="page-head"><div><h2>Raflarım</h2><p>Raflarınızı düzenleyin, koleksiyonunuzu büyütün.</p></div><button class="btn primary" data-action="add-shelf">＋ Yeni raf</button></div><div class="toolbar"><div class="search-wrap"><input class="search" id="shelfSearch" placeholder="Raf veya sanatçı ara…" value="${esc(query)}"></div><button class="btn" data-action="sort-shelves">${state.settings.shelfSort==='name'?'Numaraya göre sırala':'Ada göre sırala'}</button></div><div class="grid" id="shelfGrid">${shelfCards()}</div>`}
function shelfCards(){let list=[...state.shelves];if(state.settings.shelfSort==='name')list.sort((a,b)=>shelfName(a.id).localeCompare(shelfName(b.id),'tr'));const q=norm(query);list=list.filter(s=>!q||norm(s.name+' '+s.number).includes(q)||state.records.some(r=>r.shelfId===s.id&&norm(r.title+' '+r.artist).includes(q)));return list.map(s=>{const n=state.records.filter(r=>r.shelfId===s.id).length;return `<article class="shelf" style="--h:${s.number*47%360}" data-open-shelf="${esc(s.id)}"><div class="shelf-cover"><b class="badge">${s.number}</b>${photoHTML(s.artistPhoto,s.name)}</div><div class="shelf-info"><strong>${esc(s.name||'Raf '+s.number)}</strong><small>Raf ${s.number} · ${n} plak</small></div></article>`}).join('')||empty('Raf bulunamadı','Arama ölçütünü değiştirebilirsiniz.')}
function catalogPage(){let records=[...state.records];const q=norm(query);if(q)records=records.filter(r=>norm([r.title,r.artist,r.genre,r.year,r.label,r.notes,shelfName(r.shelfId)].join(' ')).includes(q));if(filterShelf!=='all')records=records.filter(r=>r.shelfId===filterShelf);records.sort((a,b)=>a.title.localeCompare(b.title,'tr'));return `<div class="page-head"><div><h2>Plak Kataloğu</h2><p>${records.length} plak listeleniyor.</p></div><button class="btn primary" data-action="add-record">＋ Plak ekle</button></div><div class="toolbar"><div class="search-wrap"><input class="search" id="catalogSearch" placeholder="Plak, sanatçı, tür, yıl ara…" value="${esc(query)}"></div><select class="search" id="shelfFilter" style="max-width:190px"><option value="all">Bütün raflar</option>${state.shelves.map(s=>`<option value="${esc(s.id)}" ${filterShelf===s.id?'selected':''}>${esc(s.name||'Raf '+s.number)}</option>`).join('')}</select></div><div class="record-grid" id="recordGrid">${records.map(recordCard).join('')||empty('Plak bulunamadı','Aramanızı değiştirebilir veya yeni plak ekleyebilirsiniz.')}</div>`}

function shelfForm(id){const s=id?state.shelves.find(x=>x.id===id):null;openModal(`<h3>${s?'Rafı düzenle':'Yeni raf oluştur'}</h3><form id="shelfForm"><div class="form-grid"><div class="field wide"><label>Raf adı</label><input name="name" maxlength="100" value="${esc(s?.name||'')}" placeholder="Örn. Türk sanat müziği"></div><div class="field"><label>Raf numarası</label><input name="number" type="number" min="1" value="${s?.number||nextShelfNumber()}" required></div><div class="field"><label>Sanatçı / raf fotoğrafı</label><input name="photo" type="file" accept="image/*"></div>${s?.artistPhoto?`<div class="wide"><img class="preview" src="${esc(s.artistPhoto)}"><button type="button" class="btn small" id="removeShelfPhoto">Fotoğrafı kaldır</button></div>`:''}</div><div class="dialog-actions"><button type="button" class="btn" data-close>Vazgeç</button><button class="btn primary">Kaydet</button></div></form>`);$('dialog').querySelector('[data-close]').onclick=closeModal;let remove=false;$('removeShelfPhoto')?.addEventListener('click',()=>{remove=true;$('removeShelfPhoto').textContent='Kaydedilecek: fotoğraf kaldırılacak'});$('shelfForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),number=Number(f.get('number'));if(state.shelves.some(x=>x.number===number&&x.id!==id)){alert('Bu raf numarası zaten kullanılıyor.');return}let photo=s?.artistPhoto||'';if(remove)photo='';const file=f.get('photo');if(file?.size)photo=await imageData(file);if(s){s.name=String(f.get('name')).trim();s.number=number;s.artistPhoto=photo}else state.shelves.push({id:uid(),number,name:String(f.get('name')).trim(),artistPhoto:photo,createdAt:Date.now()});state.shelves.sort((a,b)=>a.number-b.number);await persist();closeModal();render()}}

over?`<div><img class="preview" src="${esc(r.cover)}"><label><input type="checkbox" name="removeCover"> Fotoğrafı kaldır</label></div>`:''}</div><div class="field"><label><input type="checkbox" name="favorite" ${r?.favorite?'checked':''}> Favorilere ekle</label></div></div><div class="dialog-actions"><button type="button" class="btn" data-close>Vazgeç</button><button class="btn primary">${r?'Değişiklikleri kaydet':'Plak ekle'}</button></div></form>`);$('dialog').querySelector('[data-close]').onclick=closeModal;$('recordForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim(),artist=String(f.get('artist')).trim();const duplicate=state.records.find(x=>x.id!==id&&norm(x.title)===norm(title)&&norm(x.artist)===norm(artist));if(duplicate&&!confirm('Aynı sanatçı ve plak adıyla bir kayıt zaten var. Yine de eklemek istiyor musunuz?'))return;let cover=r?.cover||'';if(f.get('removeCover'))cover='';let audio=r?.audio||'';if(f.get('removeAudio'))audio='';const af=f.get('audio');if(af?.size){if(af.size>4e6){note('Ses dosyası 4 MB üzerinde.');return}audio=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(af)})}const file=f.get('cover');if(file?.size)cover=await imageData(file);const data={id:r?.id||uid(),title,artist,shelfId:String(f.get('shelfId')),genre:String(f.get('genre')).trim(),year:String(f.get('year')).trim(),label:String(f.get('label')).trim(),condition:String(f.get('condition')),notes:String(f.get('notes')).trim(),cover,audio,price:String(f.get('price')).trim(),favorite:f.get('favorite')==='on',createdAt:r?.createdAt||Date.now(),updatedAt:Date.now()};if(r)Object.assign(r,data);else state.records.push(data);await persist();closeModal();render()}}
function imageData(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('Görsel dosyası seçin'));const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>reject(new Error('Fotoğraf okunamadı'));img.src=reader.result};reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}
async function deleteShelf(id){const s=state.shelves.find(x=>x.id===id);if(!s)return;const n=state.records.filter(r=>r.shelfId===id).length;if(!confirm(`${s.name||'Raf '+s.number} silinsin mi? ${n?`Bu raftaki ${n} plak silinmeyecek; başka rafa taşınacak.`:''}`))return;if(n){const target=state.shelves.find(x=>x.id!==id);if(!target){alert('Rafı silmek için önce başka bir raf oluşturun.');return}state.records.forEach(r=>{if(r.shelfId===id)r.shelfId=target.id})}state.shelves=state.shelves.filter(x=>x.id!==id);await persist();page='shelves';render()}

  const k=norm(title)+'|'+norm(artist)+'|'+no,kn=g(r,'cond'),kv=parseFloat(kn.replace(',','.')),cond=isNaN(kv)?kn:kv>=9?'Çok iyi':kv>=7?'İyi':kv>=5?'Orta':'Hasarlı',pr=num(g(r,'price')),price=wp?pr:'',notes=[g(r,'sideA')&&norm(g(r,'sideA'))!==norm(title)&&'Ön yüz: '+g(r,'sideA'),g(r,'sideB')&&'Arka yüz: '+g(r,'sideB'),g(r,'catNo')&&'Plak no: '+num(g(r,'catNo')),!isNaN(kv)&&'KND: '+num(kn),g(r,'notes')].filter(Boolean).join(' · ');

async function xlImport(file){try{const buf=await file.arrayBuffer(),u=new Uint8Array(buf);let rows;
  if(u[0]===0x50&&u[1]===0x4B)rows=xlsxRows(await unzip(buf));

function xlPreview(p,fn){openModal('<h3>Excel’den veri yükle</h3><p><b>'+esc(fn)+'</b></p><p>'+p.add.length+' yeni plak eklenecek'+(p.newShelves?' ('+p.newShelves+' yeni raf oluşturulacak)':'')+'.<br>'+p.dup+' kayıt zaten var'+(p.upd.length?' ('+p.upd.length+' tanesinin boş fiyat/not/kondisyon alanı doldurulacak)':'')+', tekrar eklenmeyecek.<br>'+p.bad.length+' satır hatalı, atlanacak.</p>'+(p.bad.length?'<details><summary>Hatalı satırlar</summary><ul>'+p.bad.slice(0,30).map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></details>':'')+(p.hasPrice?'<p><label><input type="checkbox"'+(p.wp?' checked':'')+' onchange="xlPreview(parseRows(XS,'+(p.def||0)+',this.checked),XN)"> Excel’deki fiyat sütununu da aktar</label></p>':'')+(p.noShelf?'<p><b>Dosyada raf numarası yok.</b> Hepsi şu rafa eklensin:<br><select class="search" onchange="xlPreview(parseRows(XS,+this.value,'+(p.wp?1:0)+'),XN)"><option value="">Raf seçin…</option>'+state.shelves.map(s=>'<option value="'+s.number+'"'+(s.number===p.def?' selected':'')+'>'+esc(s.number+' — '+(s.name||'boş'))+'</option>').join('')+'</select></p>':'')+(p.add.length||p.upd.length?'':'<p class="muted">Okunan ilk satırlar: '+esc(p.peek)+'</p>')+'<p class="muted">'+esc(p.cols)+'</p><p class="muted">Mevcut kayıtlarınız silinmez veya değiştirilmez.</p><div class="dialog-actions"><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="xlGo"'+(p.add.length||p.upd.length?'':' disabled')+'>Ekle</button></div>');

async function xlApply(p){const by=new Map(state.shelves.map(x=>[x.number,x])),now=Date.now(),CD=['Belirtilmedi','Çok iyi','İyi','Orta','Hasarlı'];
 for(const u of p.upd||[]){if(!u.e.price&&u.price)u.e.price=u.price;if(!u.e.notes&&u.notes)u.e.notes=u.notes;if(u.e.condition==='Belirtilmedi'&&u.cond){const c=CD.find(c=>norm(c)===norm(u.cond));if(c)u.e.condition=c}}

 try{await persist();page='catalog';render();note(p.add.length+' plak eklendi, '+(p.upd?.length||0)+' kayıt güncellendi.')}catch(e){note('Kaydedilemedi: '+e.message)}}

const hue=id=>((state.shelves.find(x=>x.id===id)?.number||0)*47)%360;

 const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),h=hue(r.shelfId),sh=state.shelves.find(s=>s.id===r.shelfId),cx=W/2,cy=470;

 if(r.artist)y=wr(r.artist,y+6,'italic 44px Georgia',54,1);
